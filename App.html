<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="description" content="florae — программа похудения без диеты. Питание, движение и уход за собой в одном ритме."/>
<meta name="theme-color" content="#faf9f6"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="florae"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>florae — похудение без диеты</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<style>
  *, *::before, *::after { box-sizing: border-box; }

  html {
    height: 100%;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    margin: 0;
    height: 100%;
    min-height: 100dvh;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #faf9f6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    color: oklch(22% 0.04 175);
    overscroll-behavior: none;
  }

  #root {
    height: 100dvh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .dev-layout {
    flex: 1;
    display: flex;
    height: 100dvh;
    min-height: 100dvh;
    overflow: hidden;
  }

  .dev-layout__main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
    height: 100dvh;
  }

  .dev-nav-toggle {
    position: absolute;
    top: max(10px, env(safe-area-inset-top));
    left: 10px;
    z-index: 50;
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid oklch(88% 0.005 60);
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    font-size: 12px;
    font-weight: 600;
    color: oklch(30% 0.02 50);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    touch-action: manipulation;
  }

  .dev-nav-backdrop {
    display: none;
  }

  .dev-nav {
    width: 272px;
    flex-shrink: 0;
    background: #fff;
    border-right: 1px solid oklch(92% 0.005 60);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 100;
  }

  .dev-nav__header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 16px 16px 12px;
    border-bottom: 1px solid oklch(94% 0.005 60);
  }

  .dev-nav__title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.02em;
  }

  .dev-nav__subtitle {
    font-size: 11px;
    color: oklch(52% 0.02 50);
    margin-top: 2px;
  }

  .dev-nav__close {
    display: none;
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 8px;
    background: oklch(96% 0.005 60);
    font-size: 20px;
    line-height: 1;
    color: oklch(40% 0.02 50);
  }

  .dev-nav__current {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 16px;
    background: oklch(97% 0.008 60);
    font-size: 12px;
  }

  .dev-nav__current-label {
    font-weight: 600;
    color: oklch(25% 0.02 50);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .dev-nav__current-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: oklch(55% 0.02 50);
    flex-shrink: 0;
  }

  .dev-nav__steps {
    display: flex;
    gap: 6px;
    padding: 8px 16px 12px;
    border-bottom: 1px solid oklch(94% 0.005 60);
  }

  .dev-nav__steps button {
    flex: 1;
    height: 36px;
    border-radius: 8px;
    border: 1px solid oklch(90% 0.005 60);
    background: #fff;
    font-size: 16px;
    font-weight: 600;
  }

  .dev-nav__steps button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .dev-nav__overlays {
    padding: 12px 16px;
    border-bottom: 1px solid oklch(94% 0.005 60);
  }

  .dev-nav__section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: oklch(55% 0.02 50);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .dev-nav__overlay-btns {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .dev-nav__overlay-btns button {
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid oklch(88% 0.02 25);
    background: oklch(96% 0.02 25);
    color: oklch(45% 0.08 25);
    font-size: 11px;
    font-weight: 600;
  }

  .dev-nav__list {
    flex: 1;
    overflow: auto;
    padding: 8px 0 16px;
    -webkit-overflow-scrolling: touch;
  }

  .dev-nav__group {
    padding: 0 10px;
    margin-bottom: 4px;
  }

  .dev-nav__group-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 6px 4px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: oklch(35% 0.02 50);
  }

  .dev-nav__dot {
    width: 6px;
    height: 6px;
    border-radius: 3px;
  }

  .dev-nav__count {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: oklch(60% 0.02 50);
  }

  .dev-nav__item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    margin-bottom: 2px;
    border: none;
    border-radius: 8px;
    background: transparent;
    text-align: left;
    font-size: 12px;
    color: oklch(38% 0.02 50);
    cursor: pointer;
  }

  .dev-nav__item:hover {
    background: oklch(97% 0.005 60);
  }

  .dev-nav__item--active {
    background: oklch(96% 0.02 25);
    color: oklch(22% 0.02 50);
    font-weight: 600;
  }

  .dev-nav__item-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: oklch(62% 0.02 50);
    min-width: 20px;
  }

  .dev-nav__item--active .dev-nav__item-num {
    color: oklch(68% 0.18 25);
  }

  @media (max-width: 899px) {
    .dev-nav {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      box-shadow: 8px 0 32px rgba(0, 0, 0, 0.12);
    }

    .dev-nav-backdrop {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 99;
    }

    .dev-nav__close {
      display: flex;
      align-items: center;
      justify-content: center;
    }
  }

  @media (min-width: 900px) {
    .dev-layout:not(:has(.dev-nav)) .dev-nav-toggle {
      left: 10px;
    }

    .dev-layout__main .app-shell {
      max-width: 420px;
    }
  }

  .boot-loader {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: oklch(50% 0.02 50);
    font-size: 15px;
  }

  button, input, select, textarea {
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }

  button { cursor: pointer; }

  /* Полноэкранная оболочка приложения */
  .app-shell {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    min-height: 100dvh;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: var(--app-bg, #faf9f6);
    color: var(--app-text, oklch(22% 0.04 175));
    position: relative;
    overflow: hidden;
  }

  @media (min-width: 481px) {
    body {
      background: oklch(94% 0.008 60);
    }
    .app-shell {
      box-shadow: 0 0 0 1px oklch(90% 0.005 60),
                  0 24px 80px -24px rgba(0, 0, 0, 0.12);
    }
  }

  .app-shell__inner {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    padding-top: env(safe-area-inset-top, 0px);
  }

  .app-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    min-height: 0;
    width: 100%;
    -webkit-overflow-scrolling: touch;
  }

  /* Нижняя навигация */
  .tab-bar {
    display: flex;
    justify-content: space-around;
    align-items: stretch;
    flex-shrink: 0;
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .tab-bar__item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-height: 56px;
    padding: 8px 4px max(8px, env(safe-area-inset-bottom, 0px) * 0.3);
    background: transparent;
    border: none;
    font-size: 10.5px;
    letter-spacing: -0.01em;
    touch-action: manipulation;
  }

  /* Скролл внутри экранов */
  .app-screen > div:first-child {
    -webkit-overflow-scrolling: touch;
  }

  ::-webkit-scrollbar { width: 0; height: 0; }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes popIn {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
  <div id="root"><div class="boot-loader">Загрузка…</div></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>

  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel" src="components/tokens.jsx"></script>
  <script type="text/babel" src="components/ui.jsx"></script>
  <script type="text/babel" src="components/AppShell.jsx"></script>
  <script type="text/babel" src="components/TabBar.jsx"></script>
  <script type="text/babel" src="components/DevNav.jsx"></script>

  <script type="text/babel" src="components/screens/Onboarding.jsx"></script>

  <script type="text/babel" src="components/screens/Today.jsx"></script>

  <script type="text/babel" src="components/AppFinal.jsx"></script>
</body>
</html>
